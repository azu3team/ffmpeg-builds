name: Build FFmpeg LGPL

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: macOS arm64 (source build)
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install nasm yasm python-setuptools meson ninja

      - name: Build FFmpeg
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          ./build-ffmpeg-macos
          kill %1

      - name: Verify binary
        run: |
          ./workspace/bin/ffmpeg -version
          ./workspace/bin/ffmpeg -buildconf
          ./workspace/bin/ffprobe -version
          otool -L ./workspace/bin/ffmpeg
          # Verify no GPL flags
          if ./workspace/bin/ffmpeg -buildconf 2>&1 | grep -q 'enable-gpl'; then
            echo "ERROR: GPL flag detected in LGPL build!"
            exit 1
          fi

      - name: Package
        run: |
          mkdir -p dist
          cp workspace/bin/ffmpeg dist/
          cp workspace/bin/ffprobe dist/
          cd dist && tar czf ../ffmpeg-lgpl-darwin-arm64.tar.gz ffmpeg ffprobe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-lgpl-darwin-arm64
          path: ffmpeg-lgpl-darwin-arm64.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ffmpeg-lgpl-darwin-arm64.tar.gz

  repackage-windows-x64:
    name: Windows x64 (repackage BtbN LGPL)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # BtbN の月末 autobuild(長期保持される)に版固定し、SHA256 を検証する。
      # 更新時は BTBN_TAG / BTBN_ASSET / BTBN_SHA256 の 3 つを同時に変える。
      - name: Download BtbN LGPL shared build (pinned)
        env:
          BTBN_TAG: autobuild-2026-08-31-13-27
          BTBN_ASSET: ffmpeg-n8.1.2-50-g1a748fe2cd-win64-lgpl-shared-8.1
          BTBN_SHA256: e9712ffbdb03ef71bbab660c75b835bfe698ef6fad0247c76d8d394a39a3db63
        run: |
          curl -fL -o btbn.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/${BTBN_TAG}/${BTBN_ASSET}.zip"
          echo "${BTBN_SHA256}  btbn.zip" | sha256sum -c -
          unzip -q btbn.zip
          mv "${BTBN_ASSET}" btbn

      - name: Repackage runtime (ffmpeg.exe / ffprobe.exe / DLL)
        run: |
          mkdir -p dist
          cp btbn/bin/ffmpeg.exe dist/
          cp btbn/bin/ffprobe.exe dist/
          cp btbn/bin/*.dll dist/
          cd dist && zip -r ../ffmpeg-lgpl-win32-x64.zip .
          # desktop の boot 時 DL は .tar.gz を既存の tar 経路で展開する(zip は PowerShell 依存のため廃止方向)。
          # 中身は zip と同一。
          tar czf ../ffmpeg-lgpl-win32-x64.tar.gz .

      # engine(sucolab-desktop-engine)が link するための SDK。runtime zip と同じ BtbN build 由来なので
      # header / import library と DLL の ABI が一致する。DLL は runtime zip 側で配る(SDK には入れない)。
      - name: Package SDK (include / import libraries)
        run: |
          mkdir -p sdk
          cp -r btbn/include sdk/include
          cp -r btbn/lib sdk/lib
          cp btbn/LICENSE.txt sdk/ 2>/dev/null || true
          cd sdk && zip -r ../ffmpeg-lgpl-win32-x64-sdk.zip .

      - name: Verify contents
        run: |
          unzip -l ffmpeg-lgpl-win32-x64.zip
          echo "---"
          tar tzf ffmpeg-lgpl-win32-x64.tar.gz
          echo "---"
          unzip -l ffmpeg-lgpl-win32-x64-sdk.zip | tail -n 5
          unzip -l ffmpeg-lgpl-win32-x64-sdk.zip | grep -E "lib/(avcodec|avutil|swresample).lib"
          echo "---"
          sha256sum ffmpeg-lgpl-win32-x64.zip ffmpeg-lgpl-win32-x64.tar.gz ffmpeg-lgpl-win32-x64-sdk.zip
          # GPL build でないことの確認(LGPL shared build の ffmpeg.exe は --enable-gpl を持たない)
          if strings btbn/bin/avcodec-*.dll | grep -q -- "--enable-gpl"; then echo "ERROR: GPL flag detected"; exit 1; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-lgpl-win32-x64
          path: |
            ffmpeg-lgpl-win32-x64.zip
            ffmpeg-lgpl-win32-x64.tar.gz
            ffmpeg-lgpl-win32-x64-sdk.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ffmpeg-lgpl-win32-x64.zip
            ffmpeg-lgpl-win32-x64.tar.gz
            ffmpeg-lgpl-win32-x64-sdk.zip
